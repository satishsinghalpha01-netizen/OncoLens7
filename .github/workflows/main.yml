name: Deploy OncoLens7 to GitHub Pages
 
"on":
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OncoLens/package-lock.json
 
      - name: Install dependencies
        working-directory: OncoLens
        run: npm ci
 
      - name: Build Vite app
        working-directory: OncoLens
        run: npm run build
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: OncoLens/dist
 
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
 
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
